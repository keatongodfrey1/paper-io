<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paper.io Clone — Phase 1</title>
<style>
  :root { --bg: #10131a; --board: #1b2030; --accent: #ff4d6d; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: #e7ebf3;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: .3px; opacity: .9; }
  #wrap { position: relative; }
  canvas { background: var(--board); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); display: block; touch-action: none; max-width: 100%; height: auto; }
  #hud { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; min-height: 30px; max-width: 100%; }
  #hud .meta { display: flex; gap: 10px; align-items: center; }
  #hud .meta-item { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; opacity: .45; }
  #hud .lb-wrap { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #hud .lb { display: inline-flex; align-items: center; gap: 8px; padding: 4px 13px 4px 5px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.06); }
  #hud .lb-rank { width: 19px; height: 19px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.12); color: #aeb6c6; }
  #hud .lb.r1 .lb-rank { background: #ffd54a; color: #1a1400; }
  #hud .lb.r2 .lb-rank { background: #d2d9e3; color: #181b22; }
  #hud .lb.r3 .lb-rank { background: #e0935a; color: #1a0e04; }
  #hud .lb-dot { width: 10px; height: 10px; border-radius: 3px; }
  #hud .lb-name { font-weight: 700; font-size: 13px; color: #e7ebf3; }
  #hud .lb-pct { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  #hud .lb.me { background: rgba(255,77,109,0.18); border-color: rgba(255,77,109,0.55); }
  #hud .lb.me .lb-name { color: #ff9bb0; }
  .hint { font-size: 12px; opacity: .5; text-align: center; }
  .hint b { color: var(--accent); opacity: .95; }

  /* hide in-game chrome while the menu is open (keeps space so the board doesn't jump) */
  body.menuing h1, body.menuing #hud, body.menuing .hint { visibility: hidden; }

  #menu {
    position: absolute; inset: 0; border-radius: 10px;
    background: rgba(8,10,16,0.78);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
  }
  #menu .panel {
    background: rgba(23,27,38,0.97);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    padding: 30px 38px 34px;
    display: flex; flex-direction: column; align-items: center;
  }
  #menuTitle { font-size: 46px; font-weight: 800; letter-spacing: -1.4px; line-height: 1; }
  #menuTitle .dot { color: var(--accent); }
  #menuSub { font-size: 13.5px; opacity: .6; margin-top: 9px; margin-bottom: 22px; text-align: center; }
  #menu .opts { display: grid; grid-template-columns: auto auto; column-gap: 18px; row-gap: 12px; align-items: center; }
  #menu .row { display: contents; }
  #menu .rlabel { text-align: right; font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; opacity: .45; }
  #menu .ctl { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  #menu .pills { display: flex; gap: 6px; }
  #menu .pill, #menu .stepper button {
    background: rgba(255,255,255,0.08); color: #cdd3df; border: 1px solid transparent;
    border-radius: 9px; cursor: pointer; font-family: inherit;
    transition: background .12s ease, color .12s ease, filter .12s ease, transform .08s ease;
  }
  #menu .pill { padding: 7px 13px; font-size: 13px; font-weight: 600; }
  #menu .pill:hover { background: rgba(255,255,255,0.16); color: #fff; }
  #menu .pill.sel { background: var(--accent); color: #fff; }
  #menu .pill.sel:hover { filter: brightness(1.08); }
  #menu .stepper { display: flex; align-items: center; gap: 8px; }
  #menu .stepper button { width: 30px; height: 30px; font-size: 18px; line-height: 1; color: #fff; }
  #menu .stepper button:hover { background: rgba(255,255,255,0.18); }
  #menu .stepper button:active { transform: scale(0.9); }
  #menu #botCount, #menu #winValue { min-width: 42px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  #startBtn {
    align-self: stretch; margin-top: 26px; background: var(--accent); color: #fff; border: none;
    border-radius: 11px; padding: 13px 32px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    box-shadow: 0 8px 22px rgba(255,77,109,0.32); transition: background .12s ease, transform .1s ease, box-shadow .12s ease;
  }
  #startBtn:hover { background: #ff6178; transform: translateY(-1px); box-shadow: 0 10px 26px rgba(255,77,109,0.42); }
  #startBtn:active { transform: translateY(0); box-shadow: 0 6px 16px rgba(255,77,109,0.3); }
  #menu button:focus-visible, #menu .pill:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #menuBtn { position: absolute; top: 8px; left: 8px; display: none; background: rgba(20,24,34,0.85); color: #cdd3df; border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; z-index: 5; }
  #menuBtn:hover { background: rgba(40,46,62,0.95); }
  #pauseBtn { position: absolute; top: 8px; right: 8px; display: none; background: rgba(20,24,34,0.85); color: #cdd3df; border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; z-index: 5; }
  #pauseBtn:hover { background: rgba(40,46,62,0.95); }
  #joy { position: fixed; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.16); display: none; pointer-events: none; z-index: 6; }
  #joyKnob { position: absolute; left: 42px; top: 42px; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: rgba(255,255,255,0.45); }
  @media (max-width: 480px) {
    #menu .panel { padding: 20px 18px 24px; max-width: calc(100vw - 16px); }
    #menuTitle { font-size: 36px; }
    #menu .opts { grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; }
    #menu .pill { padding: 6px 10px; font-size: 12px; }
    #menu .rlabel { font-size: 10px; }
  }
</style>
</head>
<body>
  <h1>Claim the whole board</h1>
  <div id="hud"></div>
  <div id="wrap">
    <canvas id="game"></canvas>
    <button id="menuBtn">Menu</button>
    <button id="pauseBtn">Pause</button>
    <div id="joy"><div id="joyKnob"></div></div>
    <div id="menu">
      <div class="panel">
        <div id="menuTitle">Paper<span class="dot">.io</span></div>
        <div id="menuSub">Set up your game, then press Start</div>
        <div class="opts">
          <div class="row"><span class="rlabel">Difficulty</span><div class="ctl"><span class="pills" data-group="difficulty"></span></div></div>
          <div class="row"><span class="rlabel">Board</span><div class="ctl"><span class="pills" data-group="board"></span></div></div>
          <div class="row"><span class="rlabel">Speed</span><div class="ctl"><span class="pills" data-group="speed"></span></div></div>
          <div class="row"><span class="rlabel">Win</span><div class="ctl"><span class="pills" data-group="win"></span><span class="stepper"><button id="winMinus">&minus;</button><span id="winValue">100%</span><button id="winPlus">+</button></span></div></div>
          <div class="row"><span class="rlabel">Bots</span><div class="ctl"><span class="stepper"><button id="botMinus">&minus;</button><span id="botCount">3</span><button id="botPlus">+</button></span></div></div>
          <div class="row"><span class="rlabel">Lives</span><div class="ctl"><span class="stepper"><button id="livesMinus">&minus;</button><span id="livesCount">1</span><button id="livesPlus">+</button></span></div></div>
        </div>
        <button id="startBtn">Start</button>
      </div>
    </div>
  </div>
  <div class="hint">
    Arrow keys, <b>WASD</b>, or <b>drag</b> to move &nbsp;·&nbsp; loop back to claim &nbsp;·&nbsp;
    cut a trail to take that land &nbsp;·&nbsp; <b>Space</b> pause &nbsp;·&nbsp; <b>R</b> restart &nbsp;·&nbsp; <b>Esc</b> menu
  </div>

<script src="sim.js"></script>
<script>
(() => {
  "use strict";

  // The game "brain" (grid, movement, claiming, bots, scoring) lives in sim.js so the
  // multiplayer server can run the EXACT same logic. This file is the solo ENGINE:
  // DOM/menu, input, audio, rendering, the animation loop, and turning the sim's
  // events into flashes/sound/shake. In solo mode it runs one world locally.
  const PaperSim = window.PaperSim;

  // ===========================================================================
  // CONFIG (render + UI only; gameplay tuning lives in sim.js)
  // ===========================================================================
  const DIFFS = PaperSim.DIFFS;
  const DEATH_MS = PaperSim.DEATH_MS, SPAWN_INTERVAL = PaperSim.SPAWN_INTERVAL;
  const COUNT_STEP = 750, GO_MS = 550, COUNTDOWN_TOTAL = 3 * COUNT_STEP + GO_MS;
  const SHAKE_MS = 240, SHAKE_MAG = 9;
  const FLASH_MS = 320, WAVE_MS_PER_CELL = 8;
  const BOARD_CELL = { small: 10, medium: 8, large: 6 };   // finer cells...
  const SPEED_TICK = { slow: 72, normal: 48, fast: 33 };   // ...with a faster tick = same on-screen speed but ~1.5x snappier turns
  const MAX_BOTS = 30;

  const MENU_GROUPS = {
    difficulty: [["easy", "Easy"], ["normal", "Normal"], ["hard", "Hard"], ["extreme", "Extreme"]],
    board: [["small", "Small"], ["medium", "Medium"], ["large", "Large"]],
    speed: [["slow", "Slow"], ["normal", "Normal"], ["fast", "Fast"]],
    win: [["target", "Target %"], ["timed", "Timed"]],
  };
  const settings = { difficulty: "normal", board: "small", speed: "normal", win: "target", winPct: 100, winSecs: 120, bots: 3, lives: 1 };

  const COLORS = { board: "#1b2030", grid: "#232a3d", flash: "#ffffff", trailEdge: "rgba(10,12,20,0.9)" };

  // ===========================================================================
  // ENGINE STATE
  // ===========================================================================
  let difficulty, numBots, CELL, tickMs, winCond, winThreshold, timedLimitMs, lives;
  let COLS, ROWS;
  let world = null;                       // the PaperSim world we're rendering
  let state = "start";                    // start | countdown | playing | paused | dying | over
  let phaseStart = 0, playStart = 0, lastSpawn = 0;
  let overTitle = "", overSub = "";
  let shakeStart = -1e9;
  let flashes = [];                       // render-only; fed by sim events

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  function applySettings() {
    difficulty = settings.difficulty;
    numBots = settings.bots;
    CELL = BOARD_CELL[settings.board];
    tickMs = SPEED_TICK[settings.speed];
    winCond = settings.win;                  // 'target' | 'timed'
    winThreshold = settings.winPct / 100;
    timedLimitMs = settings.winSecs * 1000;
    lives = settings.lives;
  }

  function fitBoard() {
    const availW = Math.max(320, window.innerWidth - 40);
    const availH = Math.max(320, window.innerHeight - 170);
    COLS = Math.max(28, Math.min(180, Math.floor(availW / CELL)));
    ROWS = Math.max(20, Math.min(120, Math.floor(availH / CELL)));
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;
  }

  function makeWorld() {
    world = PaperSim.createWorld(
      { COLS, ROWS, difficulty, numBots, humanCount: 1, winCond, winThreshold, timedLimitMs, lives, mode: "solo" },
      { now: () => performance.now(), rng: Math.random }
    );
    world.buildWorld();
    flashes = [];
  }

  function newGame() {
    ensureAudio(); applySettings(); hideMenu(); menuBtn.style.display = "block"; pauseBtn.style.display = "block"; pauseBtn.textContent = "Pause";
    fitBoard(); makeWorld(); updateHUD();
    state = "countdown"; phaseStart = performance.now();
  }

  // ===========================================================================
  // SETTINGS MENU (DOM)
  // ===========================================================================
  const menu = document.getElementById("menu");
  const botCountEl = document.getElementById("botCount");
  const menuBtn = document.getElementById("menuBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  function buildMenu() {
    for (const g in MENU_GROUPS) {
      const box = menu.querySelector('.pills[data-group="' + g + '"]');
      box.innerHTML = "";
      for (const [k, label] of MENU_GROUPS[g]) {
        const b = document.createElement("button");
        b.className = "pill" + (settings[g] === k ? " sel" : "");
        b.textContent = label;
        b.onclick = () => { settings[g] = k; refreshSel(g); if (g === "win") updateWinStepper(); };
        box.appendChild(b);
      }
    }
    botCountEl.textContent = settings.bots;
    document.getElementById("botMinus").onclick = () => { settings.bots = Math.max(0, settings.bots - 1); botCountEl.textContent = settings.bots; };
    document.getElementById("botPlus").onclick = () => { settings.bots = Math.min(MAX_BOTS, settings.bots + 1); botCountEl.textContent = settings.bots; };
    const livesCountEl = document.getElementById("livesCount");
    livesCountEl.textContent = settings.lives;
    document.getElementById("livesMinus").onclick = () => { settings.lives = Math.max(1, settings.lives - 1); livesCountEl.textContent = settings.lives; };
    document.getElementById("livesPlus").onclick = () => { settings.lives = Math.min(10, settings.lives + 1); livesCountEl.textContent = settings.lives; };
    document.getElementById("winMinus").onclick = () => { if (settings.win === "timed") settings.winSecs = Math.max(30, settings.winSecs - 30); else settings.winPct = Math.max(10, settings.winPct - 5); updateWinStepper(); };
    document.getElementById("winPlus").onclick = () => { if (settings.win === "timed") settings.winSecs = Math.min(600, settings.winSecs + 30); else settings.winPct = Math.min(100, settings.winPct + 5); updateWinStepper(); };
    updateWinStepper();
    document.getElementById("startBtn").onclick = () => newGame();
    menuBtn.onclick = () => toMenu();
    pauseBtn.onclick = togglePause;
  }
  function refreshSel(g) {
    const box = menu.querySelector('.pills[data-group="' + g + '"]');
    [...box.children].forEach((b, i) => b.classList.toggle("sel", MENU_GROUPS[g][i][0] === settings[g]));
  }
  function fmtTime(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function updateWinStepper() { document.getElementById("winValue").textContent = settings.win === "timed" ? fmtTime(settings.winSecs) : settings.winPct + "%"; }
  function showMenu(title, sub) {
    const t = document.getElementById("menuTitle");
    if (title === "Paper.io") t.innerHTML = 'Paper<span class="dot">.io</span>'; else t.textContent = title;
    document.getElementById("menuSub").textContent = sub;
    menu.style.display = "flex"; menuBtn.style.display = "none"; pauseBtn.style.display = "none"; document.body.classList.add("menuing"); endDrag();
  }
  function hideMenu() { menu.style.display = "none"; document.body.classList.remove("menuing"); }
  function toMenu() { state = "start"; showMenu("Paper.io", "Set up your game, then press Start"); }
  function togglePause() {
    if (state === "playing") { state = "paused"; pauseBtn.textContent = "Resume"; endDrag(); }
    else if (state === "paused") { state = "playing"; last = performance.now(); acc = 0; pauseBtn.textContent = "Pause"; }
  }

  // ===========================================================================
  // INPUT  (the only gameplay input is a heading angle → world.steer)
  // ===========================================================================
  const DIRS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
  };
  addEventListener("keydown", (e) => {
    if (state === "start" || state === "over") {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); newGame(); }
      return;
    }
    if (e.key === "Escape") { toMenu(); return; }
    if (e.key === " " || e.key === "p" || e.key === "P") { e.preventDefault(); togglePause(); return; }
    if (e.key === "r" || e.key === "R") { newGame(); return; }
    if (state !== "playing") return;
    const d = DIRS[e.key];
    if (!d) return;
    e.preventDefault();
    steer(Math.atan2(d[1], d[0]));
  }, { passive: false });

  function steer(angle) {
    ensureAudio();
    if (world && world.player) world.steer(world.player, angle);
  }

  // Touch / drag steering: press and hold anywhere, then push toward a direction.
  const joy = document.getElementById("joy"), joyKnob = document.getElementById("joyKnob");
  const JOY_DEAD = 14, JOY_R = 42;
  let dragOrigin = null, joyShown = false;
  function endDrag() { dragOrigin = null; joyShown = false; joy.style.display = "none"; }
  addEventListener("pointerdown", (e) => { if (state === "playing") { dragOrigin = { x: e.clientX, y: e.clientY }; joyShown = false; } });
  addEventListener("pointermove", (e) => {
    if (!dragOrigin || state !== "playing") return;
    const dx = e.clientX - dragOrigin.x, dy = e.clientY - dragOrigin.y;
    if (Math.abs(dx) < JOY_DEAD && Math.abs(dy) < JOY_DEAD) return;   // deadzone near center keeps your current direction
    if (!joyShown) { joy.style.left = dragOrigin.x + "px"; joy.style.top = dragOrigin.y + "px"; joy.style.display = "block"; joyShown = true; }
    const m = Math.hypot(dx, dy), s = Math.min(1, JOY_R / m);
    joyKnob.style.left = (JOY_R + dx * s) + "px"; joyKnob.style.top = (JOY_R + dy * s) + "px";
    steer(Math.atan2(dy, dx));   // free-angle: head curves toward your thumb
  });
  addEventListener("pointerup", endDrag);
  addEventListener("pointercancel", endDrag);

  // ===========================================================================
  // JUICE — turn the sim's events into flashes / sound / shake
  // ===========================================================================
  function applyJuice(ev, now) {
    if (ev.type === "claim") {
      for (const c of ev.cells) flashes.push({ x: c.x, y: c.y, start: now + (Math.abs(c.x - ev.headX) + Math.abs(c.y - ev.headY)) * WAVE_MS_PER_CELL });
      if (!ev.isBot) { shakeStart = now; playClaimSound(); }
    } else if (ev.type === "death") {
      for (const c of ev.cells) flashes.push({ x: c.x, y: c.y, start: now });
      const me = world.player ? world.player.id : -1;
      if (ev.victimId === me) { shakeStart = now; playDeathSound(); }
      else if (ev.killerId === me) { shakeStart = now; playClaimSound(); }
    } else if (ev.type === "prune" || ev.type === "spawn") {
      for (const c of ev.cells) flashes.push({ x: c.x, y: c.y, start: now });
    }
    // 'endgame' / 'eliminated' are handled by the main loop via world.ended
  }

  function leaderName(counts) {
    const id = world.leaderId(counts);
    return world.player && id === world.player.id ? "You" : "Bot " + (id - 1);
  }
  function finishGame() {
    const r = world.endResult || { reason: "target", winnerId: world.player.id };
    const me = world.player ? world.player.id : -1;
    if (r.reason === "wiped") {
      endGame("Wiped out", "A bot took all your land. " + leaderName() + " leads. Press Start to play again.");
    } else if (r.reason === "timed") {
      const youWin = r.winnerId === me;
      endGame(youWin ? "Time! You win" : "Time! " + leaderName() + " wins", "Most territory when the clock ran out. Press Start to play again.");
    } else {
      const youWin = r.winnerId === me;
      endGame(youWin ? "You win!" : "Bot " + (r.winnerId - 1) + " wins",
        (winThreshold < 1 ? "First past " + Math.round(winThreshold * 100) + "%. " : "Claimed the whole board. ") + "Press Start to play again.");
    }
  }
  function endGame(title, sub) { state = "over"; overTitle = title; overSub = sub; showMenu(title, sub); }

  // ===========================================================================
  // SOUND
  // ===========================================================================
  let audio = null;
  function ensureAudio() {
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { audio = null; } }
    if (audio && audio.state === "suspended") audio.resume();
  }
  function tone(type, f0, f1, dur, peak) {
    if (!audio) return;
    const t = audio.currentTime, osc = audio.createOscillator(), gain = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.55);
    gain.gain.setValueAtTime(0.0001, t); gain.gain.exponentialRampToValueAtTime(peak, t + 0.01); gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audio.destination); osc.start(t); osc.stop(t + dur + 0.02);
  }
  function playClaimSound() { tone("triangle", 220, 70, 0.28, 0.5); }
  function playDeathSound() { tone("sawtooth", 180, 45, 0.5, 0.4); }

  // ===========================================================================
  // RENDER
  // ===========================================================================
  function draw(now, alpha) {
    const grid = world.grid, actors = world.actors, actorById = world.actorById, player = world.player;
    ctx.save();
    const sAge = now - shakeStart;
    if (sAge < SHAKE_MS) { const k = (1 - sAge / SHAKE_MS) * SHAKE_MAG; ctx.translate((Math.random() * 2 - 1) * k, (Math.random() * 2 - 1) * k); }

    ctx.fillStyle = COLORS.board;
    ctx.fillRect(-SHAKE_MAG, -SHAKE_MAG, canvas.width + 2 * SHAKE_MAG, canvas.height + 2 * SHAKE_MAG);

    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const o = grid[y][x]; if (o) { ctx.fillStyle = actorById[o].color.land; ctx.fillRect(x * CELL, y * CELL, CELL, CELL); } }

    ctx.strokeStyle = COLORS.grid; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= COLS; x++) { ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, canvas.height); }
    for (let y = 0; y <= ROWS; y++) { ctx.moveTo(0, y * CELL + .5); ctx.lineTo(canvas.width, y * CELL + .5); }
    ctx.stroke();

    for (const a of actors) {
      if (!a.alive || a.trail.length === 0) continue;
      ctx.fillStyle = a.color.trail;
      for (const c of a.trail) ctx.fillRect(c.x * CELL, c.y * CELL, CELL, CELL);
      ctx.strokeStyle = COLORS.trailEdge; ctx.lineWidth = 2;
      for (const c of a.trail) ctx.strokeRect(c.x * CELL + 1, c.y * CELL + 1, CELL - 2, CELL - 2);
    }

    flashes = flashes.filter((f) => now - f.start < FLASH_MS);
    for (const f of flashes) { const age = now - f.start; if (age < 0) continue; ctx.globalAlpha = 1 - age / FLASH_MS; ctx.fillStyle = COLORS.flash; ctx.fillRect(f.x * CELL, f.y * CELL, CELL, CELL); }
    ctx.globalAlpha = 1;

    for (const a of actors) {
      if (!a.alive) continue;
      let cxp, cyp;   // head center, px
      if (a === player) { cxp = a.fx * CELL; cyp = a.fy * CELL; }
      else { cxp = (a.prevX + (a.x - a.prevX) * alpha + 0.5) * CELL; cyp = (a.prevY + (a.y - a.prevY) * alpha + 0.5) * CELL; }
      const S = CELL - 4, P = CELL * 0.24;
      ctx.fillStyle = a.color.land; ctx.fillRect(cxp - S / 2, cyp - S / 2, S, S);
      ctx.fillStyle = a.color.head; ctx.fillRect(cxp - P / 2, cyp - P / 2, P, P);
      ctx.lineWidth = 2.5; ctx.strokeStyle = a.isBot ? "#0b0e15" : "#ffffff"; ctx.strokeRect(cxp - S / 2, cyp - S / 2, S, S);
    }

    ctx.restore();

    if (state === "dying") { ctx.globalAlpha = 0.5 * Math.max(0, 1 - (now - phaseStart) / DEATH_MS); ctx.fillStyle = "#ff2030"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalAlpha = 1; }
    else if (state === "paused") centerText("Paused", "Tap Resume or press Space");
    else if (state === "countdown") {
      const e = now - phaseStart;
      const n = e < COUNT_STEP ? "3" : e < 2 * COUNT_STEP ? "2" : e < 3 * COUNT_STEP ? "1" : "Go!";
      ctx.fillStyle = "rgba(8,10,16,0.5)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
      ctx.font = "700 64px system-ui, sans-serif"; ctx.fillText(n, canvas.width / 2, canvas.height / 2);
      ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
    }
  }
  function centerText(title, sub) {
    ctx.fillStyle = "rgba(8,10,16,0.72)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff";
    ctx.font = "700 38px system-ui, sans-serif"; ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 12);
    ctx.font = "500 16px system-ui, sans-serif"; ctx.fillStyle = "rgba(231,235,243,0.85)"; ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 26);
    ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
  }

  // ===========================================================================
  // STANDINGS
  // ===========================================================================
  const hud = document.getElementById("hud");
  function updateHUD() {
    const counts = world.countTerritory(), total = COLS * ROWS, me = world.player ? world.player.id : -1;
    const ranked = world.actors.filter((a) => a.alive).map((a) => ({ a, pct: (counts[a.id] || 0) / total * 100 })).sort((p, q) => q.pct - p.pct);
    const board = ranked.slice(0, 3);
    const meIdx = ranked.findIndex((r) => r.a.id === me);
    if (meIdx >= 3) board.push(ranked[meIdx]);   // keep your own standing on the board if you've dropped out of the top 3

    let meta = '<span class="meta-item">' + DIFFS[difficulty].label + "</span>";
    const livesLeft = world.player ? world.player.lives : lives;
    if ((state === "playing" || state === "paused" || state === "dying") && livesLeft != null) meta += '<span class="meta-item">Lives ' + Math.max(0, livesLeft) + "</span>";
    if (winCond === "timed" && (state === "playing" || state === "paused")) {
      const left = Math.max(0, timedLimitMs - (performance.now() - playStart)), s = Math.ceil(left / 1000);
      meta += '<span class="meta-item">' + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") + "</span>";
    }
    const lb = board.map((r) => {
      const rank = ranked.indexOf(r) + 1, isMe = r.a.id === me;
      return '<div class="lb' + (isMe ? " me" : "") + (rank <= 3 ? " r" + rank : "") + '">' +
        '<span class="lb-rank">' + rank + "</span>" +
        '<span class="lb-dot" style="background:' + r.a.color.land + '"></span>' +
        '<span class="lb-name">' + (isMe ? "You" : "Bot " + (r.a.id - 1)) + "</span>" +
        '<span class="lb-pct">' + r.pct.toFixed(1) + "%</span></div>";
    }).join("");
    hud.innerHTML = '<span class="meta">' + meta + '</span><span class="lb-wrap">' + lb + "</span>";
  }

  // ===========================================================================
  // MAIN LOOP
  // ===========================================================================
  let last = performance.now(), acc = 0, hudLast = 0;
  function frame(now) {
    if (state === "countdown" && now - phaseStart >= COUNTDOWN_TOTAL) { state = "playing"; last = now; acc = 0; playStart = now; lastSpawn = now; }
    if (state === "playing") {
      const dtMs = now - last; acc += dtMs; last = now;
      if (acc > tickMs * 5) acc = tickMs * 5;
      world.moveContinuous(world.player, Math.min(0.05, dtMs / 1000), tickMs);   // free-angle player, every frame
      while (!world.ended && acc >= tickMs) { world.stepBots(); acc -= tickMs; }
      if (!world.ended && winCond === "timed" && now - playStart >= timedLimitMs) world.finishTimed();
      if (!world.ended && numBots > 0 && now - lastSpawn >= SPAWN_INTERVAL) {
        let aliveBots = 0; for (const a of world.actors) if (a.isBot && a.alive) aliveBots++;
        if (aliveBots < numBots) world.spawnBot();
        lastSpawn = now;
      }
      for (const ev of world.drainEvents()) applyJuice(ev, now);
      if (world.ended) finishGame();
      else if (world.player.dead && state === "playing") { state = "dying"; phaseStart = now; }
    } else { last = now; }
    if (state === "dying" && now - phaseStart >= DEATH_MS) {
      if (world.player.lives > 0) { world.respawn(world.player); state = "playing"; last = performance.now(); acc = 0; }
      else endGame("Game over", "Out of lives. Press Start to play again.");
    }
    if (now - hudLast > 200) { updateHUD(); hudLast = now; }
    draw(now, state === "playing" ? Math.min(1, acc / tickMs) : 1);
    requestAnimationFrame(frame);
  }

  buildMenu();
  applySettings();
  fitBoard();
  makeWorld();
  updateHUD();
  showMenu("Paper.io", "Set up your game, then press Start");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
